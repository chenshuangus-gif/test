<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹧鸪骑自行车 · 3D Demo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dfeaf1; font-family: Arial, "Microsoft YaHei", sans-serif; }
    canvas { display: block; }
    .panel {
      position: fixed; left: 20px; top: 18px; z-index: 10;
      padding: 12px 15px; border-radius: 12px;
      background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,.10); color: #20252a;
      user-select: none;
    }
    .panel b { display:block; font-size: 18px; margin-bottom: 4px; }
    .panel span { font-size: 12px; opacity:.72; }
    .buttons { margin-top: 9px; display:flex; gap:7px; }
    button {
      border: 1px solid rgba(0,0,0,.13); background: rgba(255,255,255,.92);
      padding: 6px 10px; border-radius: 8px; cursor:pointer; font-size:12px;
    }
    button:hover { background:white; }
  </style>
</head>
<body>
  <div class="panel">
    <b>鹧鸪骑自行车</b>
    <span>Three.js 程序化 3D 场景 · 鼠标拖动旋转 / 滚轮缩放</span>
    <div class="buttons">
      <button id="pauseBtn">暂停</button>
      <button id="resetBtn">重置视角</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xddebf3);
    scene.fog = new THREE.Fog(0xddebf3, 16, 42);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.4, 4.6, 9.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2.05, 0);
    controls.minDistance = 5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.48;

    // ---------- Lights ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8ea48d, 1.15));
    const sun = new THREE.DirectionalLight(0xffffff, 1.55);
    sun.position.set(7, 11, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    scene.add(sun);

    // ---------- Helpers ----------
    function mat(color, roughness=.68, metalness=.02) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    function mesh(geometry, material, cast=true, receive=true) {
      const m = new THREE.Mesh(geometry, material);
      m.castShadow = cast;
      m.receiveShadow = receive;
      return m;
    }

    function tubeBetween(a, b, radius, material, radial=10) {
      const start = a.clone(), end = b.clone();
      const mid = start.clone().add(end).multiplyScalar(.5);
      const len = start.distanceTo(end);
      const g = new THREE.CylinderGeometry(radius, radius, len, radial);
      const c = mesh(g, material);
      c.position.copy(mid);
      const dir = end.clone().sub(start).normalize();
      c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
      return c;
    }

    function setTube(m, a, b) {
      const mid = a.clone().add(b).multiplyScalar(.5);
      const len = a.distanceTo(b);
      m.position.copy(mid);
      m.scale.y = len;
      const dir = b.clone().sub(a).normalize();
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
    }

    // ---------- Ground ----------
    const ground = mesh(new THREE.PlaneGeometry(80, 32), mat(0x7fa067, 1), false, true);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = -0.02;
    scene.add(ground);

    const road = mesh(new THREE.PlaneGeometry(80, 5.2), mat(0x4b5156, .95), false, true);
    road.rotation.x = -Math.PI/2;
    road.position.y = 0.005;
    scene.add(road);

    const roadLines = new THREE.Group();
    for (let i=-8; i<=8; i++) {
      const line = mesh(new THREE.BoxGeometry(2.3, .012, .09), mat(0xf5e8aa, .8), false, true);
      line.position.set(i*5.0, .025, 0);
      roadLines.add(line);
    }
    scene.add(roadLines);

    // roadside posts to enhance motion cue
    const scenery = new THREE.Group();
    for (let i=-8; i<=8; i++) {
      const x = i * 4.8 + 1.2;
      const post = mesh(new THREE.CylinderGeometry(.05,.07,.65,8), mat(0xe8e7df), false, true);
      post.position.set(x,.325,-3.05);
      scenery.add(post);
      const cap = mesh(new THREE.BoxGeometry(.18,.16,.10), mat(0xc95e4f), false, true);
      cap.position.set(x,.61,-3.05);
      scenery.add(cap);
    }
    scene.add(scenery);

    // ---------- Bicycle ----------
    const bike = new THREE.Group();
    scene.add(bike);

    const frameMat = mat(0x2f5e74, .42, .35);
    const darkMat = mat(0x202326, .75, .08);
    const tireMat = mat(0x151719, .95, 0);
    const metalMat = mat(0xb8c0c4, .27, .7);
    const saddleMat = mat(0x4b2e26, .82, .02);

    const wheelR = 1.08;
    const wheelTube = .075;
    const rearX = -1.45;
    const frontX = 1.55;
    const wheelY = 1.08;

    function makeWheel(x) {
      const wheel = new THREE.Group();
      wheel.position.set(x, wheelY, 0);
      const tire = mesh(new THREE.TorusGeometry(wheelR, wheelTube, 12, 42), tireMat);
      tire.rotation.y = Math.PI/2;
      wheel.add(tire);

      const rim = mesh(new THREE.TorusGeometry(wheelR-.08, .026, 8, 42), metalMat);
      rim.rotation.y = Math.PI/2;
      wheel.add(rim);

      for (let i=0; i<12; i++) {
        const a = i / 12 * Math.PI*2;
        const end = new THREE.Vector3(0, Math.sin(a)*(wheelR-.1), Math.cos(a)*(wheelR-.1));
        wheel.add(tubeBetween(new THREE.Vector3(0,0,0), end, .009, metalMat, 6));
      }
      const hub = mesh(new THREE.CylinderGeometry(.065,.065,.18,12), metalMat);
      hub.rotation.z = Math.PI/2;
      wheel.add(hub);
      return wheel;
    }

    const rearWheel = makeWheel(rearX);
    const frontWheel = makeWheel(frontX);
    bike.add(rearWheel, frontWheel);

    const crank = new THREE.Vector3(-.15, 1.15, 0);
    const seatJoint = new THREE.Vector3(-.55, 2.26, 0);
    const rearHub = new THREE.Vector3(rearX, wheelY, 0);
    const frontHub = new THREE.Vector3(frontX, wheelY, 0);
    const headBottom = new THREE.Vector3(.82, 1.45, 0);
    const headTop = new THREE.Vector3(.98, 2.42, 0);

    [
      [rearHub, crank], [crank, seatJoint], [seatJoint, rearHub],
      [seatJoint, headTop], [headTop, headBottom], [headBottom, crank],
      [headBottom, frontHub], [headTop, frontHub]
    ].forEach(([a,b]) => bike.add(tubeBetween(a,b,.055,frameMat,12)));

    // fork + handlebar
    bike.add(tubeBetween(headBottom, frontHub, .04, metalMat, 10));
    const handleStem = tubeBetween(headTop, new THREE.Vector3(1.09,2.68,0), .035, metalMat, 10);
    bike.add(handleStem);
    const bar = mesh(new THREE.CylinderGeometry(.035,.035,.82,10), metalMat);
    bar.rotation.x = Math.PI/2;
    bar.position.set(1.10,2.68,0);
    bike.add(bar);

    // saddle
    const saddle = mesh(new THREE.BoxGeometry(.56,.12,.30), saddleMat);
    saddle.position.set(-.60,2.45,0);
    saddle.rotation.z = -.05;
    bike.add(saddle);
    bike.add(tubeBetween(seatJoint, new THREE.Vector3(-.60,2.43,0), .037, metalMat, 10));

    // crank and pedals
    const crankDisk = mesh(new THREE.CylinderGeometry(.18,.18,.05,24), metalMat);
    crankDisk.rotation.x = Math.PI/2;
    crankDisk.position.copy(crank);
    bike.add(crankDisk);

    const crankGroup = new THREE.Group();
    crankGroup.position.copy(crank);
    bike.add(crankGroup);

    function pedalAssembly(sideSign) {
      const arm = mesh(new THREE.BoxGeometry(.42,.035,.035), metalMat);
      arm.position.x = .21;
      const pedal = mesh(new THREE.BoxGeometry(.26,.055,.14), darkMat);
      pedal.position.x = .43;
      pedal.position.z = sideSign * .16;
      const group = new THREE.Group();
      group.add(arm, pedal);
      return { group, pedal };
    }
    const pedalA = pedalAssembly(1);
    const pedalB = pedalAssembly(-1);
    crankGroup.add(pedalA.group, pedalB.group);
    pedalB.group.rotation.z = Math.PI;

    // ---------- Partridge ----------
    const bird = new THREE.Group();
    bike.add(bird);

    const feather = mat(0x8c6b4c, .92);
    const featherDark = mat(0x4e3b30, .98);
    const chest = mat(0xe2d1ad, .95);
    const face = mat(0xd6c9aa, .92);
    const beakMat = mat(0xc7813e, .78);
    const eyeMat = mat(0x070808, .35);
    const redMat = mat(0x9c3d32, .9);

    const body = mesh(new THREE.SphereGeometry(.72, 26, 18), feather);
    body.scale.set(1.00,1.18,.72);
    body.position.set(-.48,3.27,0);
    bird.add(body);

    const belly = mesh(new THREE.SphereGeometry(.53,24,16), chest);
    belly.scale.set(.78,1.12,.70);
    belly.position.set(-.22,3.16,-.31);
    bird.add(belly);

    const head = mesh(new THREE.SphereGeometry(.43,24,16), face);
    head.scale.set(.96,1.02,.88);
    head.position.set(.02,4.14,0);
    bird.add(head);

    // dark crown and neck collar
    const crown = mesh(new THREE.SphereGeometry(.435,22,14,0,Math.PI*2,0,Math.PI*.46), featherDark);
    crown.position.set(.02,4.18,0);
    bird.add(crown);

    const collar = mesh(new THREE.TorusGeometry(.31,.052,8,28,Math.PI*1.55), featherDark);
    collar.position.set(.02,3.88,-.29);
    collar.rotation.z = .12;
    bird.add(collar);

    // beak points forward (+X)
    const beak = mesh(new THREE.ConeGeometry(.12,.34,10), beakMat);
    beak.rotation.z = -Math.PI/2;
    beak.position.set(.49,4.13,0);
    bird.add(beak);

    // eyes
    [-1,1].forEach(s => {
      const eye = mesh(new THREE.SphereGeometry(.045,12,8), eyeMat);
      eye.position.set(.34,4.25,s*.31);
      bird.add(eye);
      const highlight = mesh(new THREE.SphereGeometry(.012,8,6), mat(0xffffff,.2));
      highlight.position.set(.365,4.275,s*.34);
      bird.add(highlight);
    });

    // wing patches
    [-1,1].forEach(s => {
      const wing = mesh(new THREE.SphereGeometry(.43,20,14), featherDark);
      wing.scale.set(1.15,.68,.26);
      wing.position.set(-.64,3.43,s*.48);
      wing.rotation.z = -.22;
      bird.add(wing);

      for (let i=0;i<3;i++) {
        const spot = mesh(new THREE.SphereGeometry(.07,10,8), redMat);
        spot.scale.set(1.25,.70,.33);
        spot.position.set(-.55-i*.14,3.47-i*.06,s*.57);
        bird.add(spot);
      }
    });

    // tail feathers
    for(let i=-2;i<=2;i++) {
      const tail = mesh(new THREE.ConeGeometry(.12,.72,8), i%2 ? feather : featherDark);
      tail.rotation.z = Math.PI/2 + .18;
      tail.position.set(-1.14,3.17,i*.12);
      bird.add(tail);
    }

    // wings reaching toward handlebar
    const shoulderL = new THREE.Vector3(-.23,3.58,.42);
    const shoulderR = new THREE.Vector3(-.23,3.58,-.42);
    const handL = new THREE.Vector3(1.10,2.70,.35);
    const handR = new THREE.Vector3(1.10,2.70,-.35);
    const wingArmL = tubeBetween(shoulderL, handL, .085, featherDark, 10);
    const wingArmR = tubeBetween(shoulderR, handR, .085, featherDark, 10);
    bird.add(wingArmL, wingArmR);

    // legs - base cylinders are unit height, animated by setTube
    const legMat = mat(0xb98a4d,.8);
    const thighL = mesh(new THREE.CylinderGeometry(.045,.055,1,8), legMat);
    const shinL  = mesh(new THREE.CylinderGeometry(.038,.045,1,8), legMat);
    const thighR = mesh(new THREE.CylinderGeometry(.045,.055,1,8), legMat);
    const shinR  = mesh(new THREE.CylinderGeometry(.038,.045,1,8), legMat);
    bird.add(thighL,shinL,thighR,shinR);

    const hipL = new THREE.Vector3(-.55,2.93,.22);
    const hipR = new THREE.Vector3(-.55,2.93,-.22);

    // ---------- Animation ----------
    let running = true;
    let t = 0;
    const speed = 2.2;
    const wheelAngular = speed / wheelR;

    function pedalPoint(angle, side) {
      const r=.43;
      return new THREE.Vector3(
        crank.x + Math.cos(angle)*r,
        crank.y + Math.sin(angle)*r,
        side*.16
      );
    }

    function solveKnee(hip, foot, bend=1) {
      // simple 2-link IK in XY plane
      const L1=.72, L2=.72;
      const dx=foot.x-hip.x, dy=foot.y-hip.y;
      let d=Math.sqrt(dx*dx+dy*dy);
      d=Math.min(Math.max(d,.08),L1+L2-.001);
      const a=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d));
      const base=Math.atan2(dy,dx);
      const ang=base + bend*a;
      return new THREE.Vector3(hip.x+Math.cos(ang)*L1, hip.y+Math.sin(ang)*L1, (hip.z+foot.z)*.5);
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(0.033, renderer.info.render.frame ? 1/60 : 1/60);
      if (running) t += dt;

      const a = -t*wheelAngular;
      rearWheel.rotation.x = a;
      frontWheel.rotation.x = a;
      crankGroup.rotation.z = -a;

      // pedal positions in bike coordinates
      const footL = pedalPoint(-a, .16);
      const footR = pedalPoint(-a+Math.PI, -.16);
      footL.z=.16; footR.z=-.16;

      const kneeL=solveKnee(hipL,footL, 1);
      const kneeR=solveKnee(hipR,footR,-1);
      setTube(thighL,hipL,kneeL); setTube(shinL,kneeL,footL);
      setTube(thighR,hipR,kneeR); setTube(shinR,kneeR,footR);

      // subtle bird movement
      bird.position.y = Math.sin(t*4.0)*.028;
      bird.rotation.z = Math.sin(t*2.0)*.012;
      head.rotation.z = Math.sin(t*3.2)*.035;

      // scroll road markings and posts to imply forward travel
      roadLines.children.forEach(obj => {
        obj.position.x -= running ? speed*dt : 0;
        if(obj.position.x < -42) obj.position.x += 85;
      });
      scenery.children.forEach(obj => {
        obj.position.x -= running ? speed*dt : 0;
        if(obj.position.x < -42) obj.position.x += 85;
      });

      controls.update();
      renderer.render(scene,camera);
    }
    animate();

    document.getElementById('pauseBtn').onclick = function(){
      running = !running;
      this.textContent = running ? '暂停' : '继续';
    };
    document.getElementById('resetBtn').onclick = function(){
      camera.position.set(8.4,4.6,9.5);
      controls.target.set(0,2.05,0);
      controls.update();
    };

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
